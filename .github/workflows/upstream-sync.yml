# SPDX-License-Identifier: GPL-2.0-only
name: upstream-sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve pin and release state
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python tools/sync.py > /dev/null; code=$?
          set -e
          if [ "$code" -eq 100 ]; then changed=false
          elif [ "$code" -eq 0 ]; then changed=true
          else exit "$code"
          fi
          # Read the tag from the lock, not from sync's stdout: after an update the lock is the
          # authoritative pin, and unchanged runs still need the tag to check for a release.
          tag="$(python -c "import json;print(json.load(open('upstream.lock.json'))['tag'])")"
          # The pinned tag can be ahead of the published releases (for example when the pin was
          # committed by hand): a missing release is republished from the same lock, unchanged.
          if gh release view "$tag" > /dev/null 2>&1; then missing=false; else missing=true; fi
          if [ "$changed" = true ] || [ "$missing" = true ]; then build=true; else build=false; fi
          {
            echo "tag=$tag"
            echo "changed=$changed"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "pin=$tag changed=$changed missing=$missing build=$build"

      - name: Host tests
        if: steps.sync.outputs.build == 'true'
        run: python -m unittest discover -s tests -v

      - uses: nttld/setup-ndk@v1
        if: steps.sync.outputs.build == 'true'
        with:
          ndk-version: r27c

      - name: Build module ZIP
        if: steps.sync.outputs.build == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/build.py

      - name: Commit refreshed pin
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream.lock.json module/module.prop
          git commit -m "Pin upstream ${{ steps.sync.outputs.tag }}"
          git push

      - name: Publish release
        if: steps.sync.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.sync.outputs.tag }}"
          notes="Tracks upstream LKM release [$tag](https://github.com/inforcqb/susfs4ksu-lkm/releases/tag/$tag). Multi-KMI arm64, hash-verified against upstream.lock.json."
          gh release create "$tag" dist/*.zip --title "$tag" --notes "$notes" \
            || gh release upload "$tag" dist/*.zip --clobber
